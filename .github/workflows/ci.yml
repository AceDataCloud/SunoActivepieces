name: CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci --legacy-peer-deps --ignore-scripts
      - run: npm test
      - run: npm pack --dry-run
